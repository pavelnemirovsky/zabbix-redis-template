# User parameters for Redis / KeyDB / Valkey template (see zbx_redis_discovery.sh).
#
# Paths must match your install: adjust the discovery script path below if not in /usr/local/bin.
# Discovery (mode "general") writes caches used here:
#   /tmp/redis-<HOST>-<PORT>              — redis.stat.get / redis.stat.mget
#   /tmp/redis-<HOST>-<PORT>-slowlog-*    — slowlog items
#   /tmp/redis-<HOST>-<PORT>-maxclients   — redis.maxclients
#   /tmp/redis-cli                        — first line = baseline CLI path (same as discovery)
#
# DISCOVERY (@PARAMS = #1 mode, #2 optional password)
UserParameter=redis.discovery[*],/usr/local/bin/zbx_redis_discovery.sh $1 $2
#
# METRICS (@PARAMS = #1 metric name, #2 REDIS HOST, #3 REDIS PORT) — reads info cache from discovery
UserParameter=redis.stat.get[*],output=`cat /tmp/redis-$2-$3 2>/dev/null | grep "$1:" | cut -d":" -f2-`; if [ -z "$output" ]; then echo 0; else echo "$output"; fi
#
# METRICS (@PARAMS = #1 cmdstat key e.g. cmdstat_ping, #2 subkey e.g. calls, #3 HOST, #4 PORT)
# Portable (no grep -P); subkey=value pairs after the first ":" on the cmdstat line
UserParameter=redis.stat.mget[*],output=`cat /tmp/redis-$3-$4 2>/dev/null | grep "$1:" | sed 's/^[^:]*://' | tr ',' '\n' | grep "^$2=" | head -1 | cut -d= -f2-`; if [ -z "$output" ]; then echo 0; else echo "$output"; fi
#
# METRICS (@PARAMS = #1 HOST, #2 PORT)
UserParameter=redis.slowlog.count[*],output=`cat /tmp/redis-$1-$2-slowlog-len 2>/dev/null`; if [ "$output" = "" ]; then echo 0; else echo "$output"; fi
#
# @PARAMS: HOST, PORT, PASSWORD — slowlog reset uses same CLI as discovery (/tmp/redis-cli first line)
UserParameter=redis.slowlog.get[*],output=`cat /tmp/redis-$1-$2-slowlog-raw 2>/dev/null`; if [ "$output" = "" ]; then echo 0; else echo "$output"; RCLI=$(head -n 1 /tmp/redis-cli 2>/dev/null); RCLI=${RCLI:-$(command -v redis-cli 2>/dev/null)}; RCLI=${RCLI:-redis-cli}; "$RCLI" -h $1 -p $2 -a "$3" slowlog reset 2>/dev/null; fi
#
UserParameter=redis.maxclients[*],output=`cat /tmp/redis-$1-$2-maxclients 2>/dev/null`; if [ "$output" = "" ]; then echo 0; else echo "$output"; fi
